spring.application.name=backend

spring.config.import=optional:file:.env[.properties]
liveblocks.secret-key=${LIVEBLOCKS_SECRET_KEY}
spring.mongodb.uri=mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@confluo-cluster.nh8oqx3.mongodb.net/confluo?appName=confluo-cluster
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=25MB
# Leave room for multipart headers while retaining the 25 MB per-file limit.
spring.servlet.multipart.max-request-size=26MB
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000
jwt.refresh-token-expiration-ms=1296000000
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
git.storage.base-path=${GIT_STORAGE_BASE_PATH:data/git-storage}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope[0]=read:user
spring.security.oauth2.client.registration.github.scope[1]=user:email

app.execution-service-url=${APP_EXECUTION_SERVICE_URL:http://localhost:4000}
app.execution-service-token=${APP_EXECUTION_SERVICE_TOKEN:}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
