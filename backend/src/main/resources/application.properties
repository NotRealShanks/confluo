spring.application.name=backend

spring.config.import=optional:file:.env[.properties]
liveblocks.secret-key=${LIVEBLOCKS_SECRET_KEY}
spring.mongodb.uri=mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@confluo-cluster.nh8oqx3.mongodb.net/confluo?appName=confluo-cluster
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope[0]=read:user
spring.security.oauth2.client.registration.github.scope[1]=user:email